<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>许怡馨 · 你好，我是许怡馨</title>
<meta name="description" content="许怡馨 — 品牌传播 · 内容营销 · 达人种草" />

<!-- 字体：标题衬线(Noto Serif SC / Cormorant / EB Garamond)，正文细黑体(Inter / Noto Sans SC) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ============ 视觉规范：低饱和杂志风 ============ */
:root{
  --bg:#F1EEE7;        /* 背景 米灰 */
  --card:#E8E4DB;      /* 卡片 暖灰 */
  --card-2:#EFEAE1;
  --surface:#FBFAF7;   /* 近白卡片面 */
  --ink:#2E2B26;       /* 文字 墨黑 */
  --muted:#6E6860;     /* 次要 灰褐 */
  --sage:#8FA08A;      /* 主色 鼠尾草绿 */
  --pink:#C9A9A4;      /* 辅助 灰粉 */
  --brown:#A08A78;     /* 辅助 暖棕 */
  --olive:#6B7C64;     /* 强调 深橄榄 */
  --line:rgba(46,43,38,.14);
  --maxw:1200px;
  --serif-en:"Cormorant Garamond","EB Garamond",serif;
  --serif:"Noto Serif SC","Cormorant Garamond","EB Garamond",serif;
  --sans:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:linear-gradient(110deg,#FCDCE3 0%,#F4E5D3 25%,#DDE9D0 50%,#CDDBE6 75%,#DCD4E5 100%);background-attachment:fixed;color:var(--ink);line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul{list-style:none}
section[id]{scroll-margin-top:76px}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px}
h1,h2,h3,h4,.serif{font-family:var(--serif);font-weight:500;letter-spacing:.01em}

/* ---------- 导航 ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(241,238,231,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-family:var(--serif);font-size:20px;font-weight:600}
.brand-dot{color:var(--olive)}
.nav-links{display:flex;gap:32px}
.nav-links a{font-size:14px;color:var(--muted);letter-spacing:.06em;transition:color .3s}
.nav-links a:hover{color:var(--ink)}
.nav-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px}
.nav-toggle span{width:24px;height:2px;background:var(--ink);border-radius:2px}

/* ---------- Hero（左文右图 · 杂志风） ---------- */
.hero{padding:132px 0 72px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center}
.hero-eyebrow{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--olive);margin-bottom:20px}
.hero-title{font-size:clamp(36px,5.6vw,68px);line-height:1.1;font-weight:400;white-space:nowrap}
.hero-tagline{margin-top:18px;font-size:16px;color:var(--olive);letter-spacing:.12em}
.hero-cta{margin-top:36px;display:flex;gap:16px;flex-wrap:wrap}
.hero-image{position:relative;width:min(320px,86%);margin-left:auto}
.hero-image::before{content:"";position:absolute;inset:-14px;border:1px solid var(--line);border-radius:50%;pointer-events:none}
.hero-image img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:50%;box-shadow:0 16px 38px rgba(46,43,38,.14)}
.hero-image-cap{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--surface);background:rgba(46,43,38,.45);padding:5px 12px;border-radius:999px;backdrop-filter:blur(4px)}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 30px;border-radius:999px;font-size:14px;letter-spacing:.08em;border:1px solid transparent;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.btn-primary{background:var(--sage);color:#FBFAF7;border-color:var(--sage)}
.btn-primary:hover{background:var(--olive);border-color:var(--olive)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:#FBFAF7}

/* ---------- 数据战绩 ---------- */
.stats{padding:24px 0 8px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px;text-align:center}
.stat-num{font-family:var(--serif-en);font-size:clamp(28px,4vw,44px);color:var(--olive);font-weight:500;line-height:1}
.stat-unit{font-size:.5em;margin-left:2px}
.stat-label{margin-top:10px;font-size:13px;color:var(--muted);letter-spacing:.05em}

/* ---------- 区块通用 ---------- */
.section{padding:96px 0}
.section-alt{background:transparent}
.sec-head{display:flex;gap:22px;align-items:flex-start;margin-bottom:52px}
.sec-no{font-family:var(--serif-en);font-size:42px;color:var(--pink);line-height:1;font-weight:400}
.sec-zh{font-size:clamp(28px,4vw,40px)}
.sec-en{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.sec-desc{margin-top:12px;color:var(--muted);font-size:15px;max-width:560px}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:transform .35s ease,box-shadow .35s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(46,43,38,.09)}

/* ---------- 个人优势（3列 + 中心人物 + 4 浮标） ---------- */
.advantage{position:relative;padding:96px 0 80px;overflow:hidden}
.advantage-head{text-align:center;margin-bottom:56px}
.advantage-head .sec-zh{font-size:clamp(32px,4.6vw,44px)}
.advantage-head .sec-en{color:var(--olive);margin-top:8px}
.advantage-head .adv-tagline{margin-top:14px;color:var(--muted);font-size:14px;letter-spacing:.16em}
.advantage-grid{position:relative;display:grid;grid-template-columns:1fr 520px 1fr;column-gap:36px;align-items:center;max-width:1200px;margin:0 auto;padding:0 24px}
.adv-col{display:flex;flex-direction:column;gap:22px}
.adv-col.left{align-items:flex-end}
.adv-col.right{align-items:flex-start}
.adv-card{width:100%;max-width:380px;background:var(--surface);border-radius:14px;padding:26px 28px;box-shadow:0 8px 24px rgba(46,43,38,.07);transition:transform .35s ease,box-shadow .35s ease}
.adv-card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(46,43,38,.12)}
.adv-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:#fff}
.adv-icon svg{width:20px;height:20px}
.adv-icon.tone-pink{background:#E8A0A8}
.adv-icon.tone-green{background:#9CB69A}
.adv-icon.tone-purple{background:#A595C7}
.adv-icon.tone-cyan{background:#7DB4BD}
.adv-title{font-size:18px;font-weight:500;color:var(--ink);margin-bottom:2px;font-family:var(--serif)}
.adv-title-en{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.adv-points{margin-top:4px}
.adv-points li{position:relative;padding-left:14px;color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:6px}
.adv-points li::before{content:"";position:absolute;left:0;top:11px;width:5px;height:1px;background:var(--sage)}
.adv-pill{display:inline-block;margin-top:18px;padding:5px 14px;border-radius:999px;font-size:12px;letter-spacing:.04em}
.adv-pill.tone-pink{background:rgba(232,160,168,.18);color:#A35460}
.adv-pill.tone-green{background:rgba(156,182,154,.22);color:#557256}
.adv-pill.tone-purple{background:rgba(165,149,199,.22);color:#6B5B8C}
.adv-pill.tone-cyan{background:rgba(125,180,189,.22);color:#3E6F76}
.adv-center{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:640px}
.adv-avatar{position:relative;z-index:2;width:100%;max-width:500px;display:block}
.adv-base{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:520px;height:60px;background:radial-gradient(ellipse at center, rgba(181,216,220,.6) 0%, rgba(181,216,220,0) 70%);border-radius:50%;z-index:1}
/* Three.js 粒子环画布：位于底座之上、人物之下（人物自然遮挡环的前半圈，营造环绕纵深） */
.adv-particles{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:280px;z-index:1;pointer-events:none}
.adv-floats{position:absolute;inset:0;z-index:3;pointer-events:none}
.adv-float-icon{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(46,43,38,.1);display:flex;align-items:center;justify-content:center;color:var(--olive);flex-shrink:0}
.adv-float-icon svg{width:20px;height:20px}
.adv-float-cap{display:flex;flex-direction:column;line-height:1.2}
.adv-float-cap b{font-size:13px;font-weight:500;color:var(--ink)}
.adv-float-cap span{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.adv-float.lt{left:-8px;top:18%}
.adv-float.rt{right:-8px;top:18%}
.adv-float.lb{left:-8px;bottom:18%}
.adv-float.rb{right:-8px;bottom:18%}
@media (max-width:980px){
  .advantage-grid{grid-template-columns:1fr;row-gap:32px;padding:0 20px}
  .adv-center{min-height:auto;order:-1;padding:20px 0}
  .adv-floats{display:none}
  .adv-col.left,.adv-col.right{align-items:stretch}
  .adv-card{max-width:100%}
}

/* ---------- 经历时间线（居中 + 左右交替） ---------- */
.timeline{position:relative;max-width:1080px;margin:0 auto}
.timeline::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:var(--line);transform:translateX(-50%)}
.tl-item{position:relative;display:grid;grid-template-columns:1fr 100px 1fr;column-gap:32px;align-items:center;padding-bottom:64px}
.tl-item:last-child{padding-bottom:0}
.tl-side.left{grid-column:1;justify-self:end;width:100%;max-width:460px;display:flex;flex-direction:column}
.tl-side.right{grid-column:3;justify-self:start;width:100%;max-width:460px;display:flex;flex-direction:column}
.tl-marker{grid-column:2;position:relative;display:flex;flex-direction:column;align-items:center;padding:0 4px;z-index:2}
.tl-stage{font-family:var(--serif);font-size:15px;letter-spacing:.06em;color:var(--ink);text-align:center;white-space:nowrap}
.tl-period{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.04em;white-space:nowrap;text-align:center}
.tl-dot{width:14px;height:14px;border-radius:50%;background:var(--sage);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line),0 0 0 5px rgba(107,124,100,.08);margin-top:10px;position:relative;z-index:3}
.tl-card{padding:24px 28px;width:100%}
.tl-org{font-size:22px}
.tl-role{color:var(--brown);font-size:14px;margin:2px 0 12px}
.tl-points li{position:relative;padding-left:16px;color:var(--muted);font-size:14px;margin-bottom:6px}
.tl-points li::before{content:"";position:absolute;left:0;top:12px;width:7px;height:1px;background:var(--sage)}
.tl-img{width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:var(--card);position:relative;box-shadow:0 10px 28px rgba(46,43,38,.1)}
.tl-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.tl-img:hover img{transform:scale(1.04)}
.tl-caption{font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.04em;text-align:center}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{font-size:12px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);letter-spacing:.05em}

/* ---------- 作品板块 ---------- */
.board{margin-bottom:76px}
.board:last-child{margin-bottom:0}
.board-head{display:flex;gap:18px;align-items:flex-start;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:34px}
.board-no{font-family:var(--serif-en);font-size:34px;color:var(--sage);line-height:1}
.board-name{font-size:clamp(22px,3vw,30px)}
.board-en{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.board-desc{margin-top:10px;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-head{display:flex;align-items:baseline;gap:14px;margin:38px 0 18px;flex-wrap:wrap}
.sub-title{font-size:20px}
.sub-note{font-size:13px;color:var(--muted)}

/* 公众号推文 */
.article-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.article-card{display:flex;flex-direction:column}
.article-cover img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.article-body{padding:16px 18px;display:flex;flex-direction:column;flex:1}
.article-body h4{font-size:16px}
.article-body p{font-size:13px;color:var(--muted);margin-top:6px;flex:1}
.link-more{display:inline-block;margin-top:12px;font-size:13px;color:var(--olive)}

/* 平面设计 · 左右滑动 carousel（4 张同可见的等大缩略图） */
.gallery{position:relative;padding:30px 64px 50px;overflow:hidden}
.gallery-track{display:flex;align-items:center;gap:18px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:20px 24px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gallery-track::-webkit-scrollbar{display:none}
.gallery-item{flex:0 0 auto;width:240px;scroll-snap-align:center;border-radius:10px;overflow:hidden;background:none;border:1px solid var(--line);transition:transform .32s var(--ease-out),opacity .32s var(--ease-out),box-shadow .32s var(--ease-out);opacity:.6;transform:none;padding:0;cursor:pointer}
.gallery-item.is-active{opacity:1;box-shadow:0 12px 36px rgba(46,43,38,.18);border-color:transparent}
.gallery-item img{display:block;width:100%;height:auto}
.gallery-arrow{position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(251,250,247,.92);color:var(--ink);font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;z-index:5;backdrop-filter:blur(6px);transition:background .25s ease,box-shadow .25s ease,transform .2s ease;box-shadow:0 4px 14px rgba(46,43,38,.08)}
.gallery-arrow:hover{background:#fff;transform:scale(1.06);box-shadow:0 6px 20px rgba(46,43,38,.14)}
.gallery-arrow.prev{left:10px}
.gallery-arrow.next{right:10px}
.gallery-count{position:absolute;right:18px;bottom:8px;font-size:12px;letter-spacing:.08em;color:var(--muted);background:rgba(251,250,247,.9);padding:5px 12px;border-radius:14px;border:1px solid var(--line)}
.lightbox{position:fixed;inset:0;z-index:1000;background:rgba(24,22,19,.93);display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:lbFade .25s ease}
.lightbox-img{max-width:90vw;max-height:86vh;width:auto;height:auto;object-fit:contain;cursor:default;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox-close{position:absolute;top:18px;right:22px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.lightbox-close:hover{background:rgba(255,255,255,.16)}
.lightbox-arrow{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.lightbox-arrow:hover{background:rgba(255,255,255,.16)}
.lightbox-arrow.prev{left:22px}
.lightbox-arrow.next{right:22px}
@keyframes lbFade{from{opacity:0}to{opacity:1}}

/* 视频输出 */
.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.video-cover{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--card)}
.video-cover img{width:100%;height:100%;object-fit:cover;display:block}
.video-cover-ph{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);text-align:center;color:var(--muted);font-size:13px;letter-spacing:.05em}
.video-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(46,43,38,.55);color:#FBFAF7;display:flex;align-items:center;justify-content:center;font-size:18px}
.video-body{padding:14px 18px}
.video-body h4{font-size:16px}
.video-body p{font-size:13px;color:var(--muted);margin-top:4px}

/* 品牌活动策划 */
.campaign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.campaign-cover{aspect-ratio:3/2;overflow:hidden;background:var(--card)}
.campaign-cover img{width:100%;height:100%;object-fit:cover;display:block}
.campaign-body{padding:20px 22px}
.campaign-body h4{font-size:19px}
.campaign-role{font-size:13px;color:var(--brown);margin:4px 0 8px}
.campaign-body>p{font-size:14px;color:var(--muted)}
.metric-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.metric{font-size:12px;font-weight:500;color:var(--olive);background:rgba(107,124,100,.12);padding:4px 10px;border-radius:6px;letter-spacing:.03em}

/* 达人种草 */
.seed-masonry{columns:4;column-gap:16px}
.seed-card{display:inline-block;width:100%;break-inside:avoid;margin-bottom:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:8px;transition:transform .35s ease,box-shadow .35s ease}
.seed-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(46,43,38,.1)}
.seed-cover{width:100%;display:block;height:auto}
.seed-cover-ph{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;background:linear-gradient(135deg,var(--card),var(--card-2));color:var(--muted);font-size:13px;letter-spacing:.05em}
.seed-body{padding:14px 16px}
.seed-platform{display:block;font-size:11px;letter-spacing:.12em;color:var(--pink);text-transform:uppercase}
.seed-body h4{font-size:15px;line-height:1.5;margin-top:6px;font-family:var(--serif)}
/* ---------- 图片占位块 ---------- */
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--card) 0%,var(--card-2) 100%);border:1px dashed rgba(46,43,38,.22);border-radius:6px;color:var(--muted);width:100%}
.ph.round{border-radius:50%;aspect-ratio:1/1}
.ph-label{font-size:13px;letter-spacing:.06em}
.ph-play{width:34px;height:34px;color:var(--sage)}

/* ---------- 联系 ---------- */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;grid-auto-rows:1fr;align-items:stretch}
.contact-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;gap:6px;min-height:260px;height:100%;box-sizing:border-box}
.contact-ic{width:30px;height:30px;color:var(--sage);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.contact-ic svg{width:100%;height:100%}
.contact-label{font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.contact-value{font-size:16px;font-family:var(--serif);color:var(--ink)}
.contact-qr .ph{margin-bottom:8px}
.contact-qr-img{width:140px;height:140px;object-fit:contain;display:block;margin-bottom:10px;background:var(--surface)}

/* ---------- 页脚 ---------- */
.footer{border-top:1px solid var(--line);padding:52px 0;text-align:center}
.footer-thanks{font-family:var(--serif);font-size:24px}
.footer-copy{margin-top:12px;font-size:13px;color:var(--muted);letter-spacing:.06em}

/* ---------- 渐显（轻量，非复杂动效） ---------- */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease-out,transform .6s ease-out}
.reveal.on{opacity:1;transform:none}

/* ---------- 响应式 ---------- */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{transition:none;opacity:1;transform:none}
  .card{transition:none}
}

.card,.adv-card,.seed-card,.contact-card{
  transition:transform .32s var(--ease-out),box-shadow .32s var(--ease-out),border-color .25s var(--ease-out);
  will-change:transform
}
.card:hover,.adv-card:hover,.seed-card:hover,.contact-card:hover{
  transform:translateY(-4px) scale(1.005);
  box-shadow:0 14px 34px rgba(46,43,38,.1)
}
.contact-card:hover{border-color:var(--sage)}

/* 视频封面：图片 hover 缩放 + 播放按钮放大 */
.video-cover img{transition:transform .4s var(--ease-out),filter .3s var(--ease-out)}
.video-card:hover .video-cover img{transform:scale(1.03);filter:brightness(1.05)}
.video-play{transition:transform .25s var(--ease-out),background .25s var(--ease-out)}
.video-card:hover .video-play{transform:translate(-50%,-50%) scale(1.12);background:rgba(46,43,38,.7)}

/* tag hover */
.tag{transition:transform .25s var(--ease-out),border-color .25s var(--ease-out),color .25s var(--ease-out)}
.tag:hover{transform:translateY(-1px);border-color:var(--sage);color:var(--olive)}

/* carousel 非 active 卡片 hover（暗示可点） */
.gallery-item:hover:not(.is-active){opacity:.9}

/* 按压反馈 */
.btn-primary,.btn-ghost{transition:transform .16s var(--ease-out),background .25s var(--ease-out),color .25s var(--ease-out),border-color .25s var(--ease-out),box-shadow .25s var(--ease-out)}
.btn-primary:active{transform:scale(.96);box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.btn-ghost:active{transform:scale(.96);box-shadow:inset 0 2px 6px rgba(46,43,38,.08)}
.btn-ghost:hover{background:rgba(46,43,38,.05);color:var(--ink)}

.lightbox-close:active,.lightbox-arrow:active{transform:scale(.92)}
.lightbox-arrow:active{transform:translateY(-50%) scale(.92)}

/* tl-side 方向化 reveal */
.tl-side.left .reveal{transform:translateX(-30px)}
.tl-side.right .reveal{transform:translateX(30px)}

/* tl-dot 进入视口 pulse 一次 */

.reveal.on .tl-dot{animation:tlDotPulse .5s var(--ease-out) 1}

/* 灯箱入场：图片从 scale 0.85 + translateY 20px 渐入 */

.lightbox-img{animation:lbZoom .3s var(--ease-out)}

/* 滚动进度线（Nav 顶部 2px） */
.scroll-progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--sage),var(--olive));z-index:999;width:0;pointer-events:none}

@keyframes enterUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

// 滚动渐显容器（轻量，可用 prefers-reduced-motion 关闭；delay 用于 stagger）
function Reveal({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVis(true); io.disconnect(); }
    }, { threshold: 0.12 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return <div ref={ref} className={"reveal" + (vis ? " on" : "") + (className ? " " + className : "")} style={delay ? { transitionDelay: `${delay}ms` } : undefined}>{children}</div>;
}

function Tag({ children }) { return <span className="tag">{children}</span>; }

      )}
      <span className="ph-label">{label}</span>
    </div>
  );
}

function Advantages() {
  const particlesRef = useRef(null);
  // P3：Three.js 粒子环（懒加载 + 可见时才渲染；reduced-motion 直接禁用；移动端粒子减半）
  useEffect(() => {
    if (window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    const canvas = particlesRef.current;
    if (!canvas) return;
    let started = false;
    let cleanup = null;
    const start = async () => {
      if (started) return;
      started = true;
      try {
        // UMD 动态加载（兼容 file:// 直开与不规范 MIME 的静态服务；three r147 为最后 UMD 版本）
        const THREE = await new Promise((resolve, reject) => {
          if (window.THREE) return resolve(window.THREE);
          const s = document.createElement("script");
          s.src = "libs/three.min.js";
          s.onload = () => resolve(window.THREE);
          s.onerror = reject;
          document.head.appendChild(s);
        });
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setClearColor(0x000000, 0);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 1, 2000);
        camera.position.set(0, 110, 330);
        camera.lookAt(0, 10, 0);
        const isMobile = window.matchMedia("(hover:none)").matches || window.innerWidth < 768;
        const COUNT = isMobile ? 30 : 60;
        const pos = new Float32Array(COUNT * 3);
        for (let i = 0; i < COUNT; i++) {
          const a = (i / COUNT) * Math.PI * 2;
          const r = 165 + (Math.random() - 0.5) * 16;
          pos[i * 3] = Math.cos(a) * r;
          pos[i * 3 + 1] = (Math.random() - 0.5) * 12;
          pos[i * 3 + 2] = Math.sin(a) * r;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ color: 0x7fb8bd, size: 6, sizeAttenuation: true, transparent: true, opacity: 0.9, depthWrite: false });
        const ring = new THREE.Points(geo, mat);
        const group = new THREE.Group();
        group.add(ring);
        group.position.y = -30; // 环心下移，贴合底座（人物脚下）
        scene.add(group);
        const resize = () => {
          const w = canvas.clientWidth || 1;
          const h = canvas.clientHeight || 1;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        };
        resize();
        window.addEventListener("resize", resize);
        // 仅当画布在视口内时才渲染（省电省性能）
        let visible = true;
        const vio = new IntersectionObserver((es) => es.forEach((e) => { visible = e.isIntersecting; }));
        vio.observe(canvas);
        let raf = 0;
        const loop = (t) => {
          raf = requestAnimationFrame(loop);
          if (!visible) return;
          const s = t / 1000;
          group.rotation.y = s * (Math.PI * 2 / 30);       // 30s/圈
          const b = 1 + 0.04 * Math.sin(s * Math.PI * 2 / 3); // 3s 呼吸 ±4%
          group.scale.set(b, 1, b);
          renderer.render(scene, camera);
        };
        raf = requestAnimationFrame(loop);
        cleanup = () => {
          cancelAnimationFrame(raf);
          vio.disconnect();
          window.removeEventListener("resize", resize);
          geo.dispose();
          mat.dispose();
          renderer.dispose();
        };
      } catch (err) {
        canvas.remove(); // WebGL 不可用时静默降级
      }
    };
    // 懒加载：进入视口前 300px 才开始加载 three.module.js
    const io = new IntersectionObserver((es) => {
      es.forEach((e) => { if (e.isIntersecting) { start(); io.disconnect(); } });
    }, { rootMargin: "300px" });
    io.observe(canvas);
    return () => { io.disconnect(); if (cleanup) cleanup(); };
  }, []);
  return (
    <section className="advantage" id="advantage">
      <div className="container">
        <div className="advantage-head">
          <Reveal><h2 className="sec-zh">个人优势</h2></Reveal>
          <Reveal><p className="sec-en">Personal Advantages</p></Reveal>
          <Reveal><p className="adv-tagline">用品牌视角做内容｜用数据方法驱动增长</p></Reveal>
        </div>
        <div className="advantage-grid">
          <div className="adv-col left">
            <AdvCard a={ADVANTAGES[0]} delay={0} />
            <AdvCard a={ADVANTAGES[1]} delay={60} />
          </div>
          <div className="adv-center">
            <span className="adv-base" />
            <canvas ref={particlesRef} className="adv-particles" aria-hidden="true" />
            <img className="adv-avatar" src="images/avatar-advantage.png" alt="个人形象" />
            <div className="adv-floats">
              <span className="adv-float-icon adv-float lt"><AdvIcon name="analysis" /></span>
              <span className="adv-float-icon adv-float rt"><AdvIcon name="channel" /></span>
              <span className="adv-float-icon adv-float lb"><AdvIcon name="content" /></span>
              <span className="adv-float-icon adv-float rb"><AdvIcon name="ai" /></span>
            </div>
          </div>
          <div className="adv-col right">
            <AdvCard a={ADVANTAGES[2]} delay={0} />
            <AdvCard a={ADVANTAGES[3]} delay={60} />
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---------- 平面设计 · 左右滑动 carousel ---------- */
function GalleryGrid({ images }) {
  const [lb, setLb] = useState(null);
  const [cur, setCur] = useState(0);
  const trackRef = useRef(null);
  const galleryRef = useRef(null);
  const didMount = useRef(false);

  useEffect(() => {
    // 跳过首次挂载，避免打开页面时 scrollIntoView 把 gallery 滚进视口（页面自动跳转到中间）
    if (!didMount.current) { didMount.current = true; return; }
    if (!trackRef.current) return;
    const el = trackRef.current.children[cur];
    if (el) el.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
  }, [cur]);

  useEffect(() => {
    if (lb === null) return;
    const onKey = (e) => {
      if (e.key === "Escape") setLb(null);
      else if (e.key === "ArrowRight") setLb(i => { const n = (i + 1) % images.length; setCur(n); return n; });
      else if (e.key === "ArrowLeft") setLb(i => { const n = (i - 1 + images.length) % images.length; setCur(n); return n; });
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [lb, images.length]);

  // 灯箱打开时锁定背景滚动，关闭时恢复（防止遮罩下页面滚动/跳动）
  useEffect(() => {
    if (lb === null) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };
  }, [lb]);

  const slide = (delta) => {
    setCur(i => (i + delta + images.length) % images.length);
  };

  return (
    <React.Fragment>
      <div className="gallery" ref={galleryRef}>
        <button className="gallery-arrow prev" onClick={() => slide(-1)} aria-label="上一张">‹</button>
        <div className="gallery-track" ref={trackRef}>
          {images.map((img, i) => (
            <button
              key={i}
              className={`gallery-item ${i === cur ? "is-active" : ""}`}
              onClick={() => { setCur(i); setLb(i); }}
              aria-label={img.title}
            >
              <img src={img.src} alt={img.title} loading="lazy" />
            </button>
          ))}
        </div>
        <button className="gallery-arrow next" onClick={() => slide(1)} aria-label="下一张">›</button>
        <span className="gallery-count">{cur + 1} / {images.length}</span>
      </div>
      {lb !== null && (
        <div className="lightbox" onClick={() => setLb(null)}>
          <button className="lightbox-close" onClick={() => setLb(null)} aria-label="关闭">×</button>
          <button className="lightbox-arrow prev" onClick={(e) => { e.stopPropagation(); setLb(i => { const n = (i - 1 + images.length) % images.length; setCur(n); return n; }); }} aria-label="上一张">‹</button>
          <img key={images[lb].src} className="lightbox-img" src={images[lb].src} alt={images[lb].title} onClick={(e) => e.stopPropagation()} />
          <button className="lightbox-arrow next" onClick={(e) => { e.stopPropagation(); setLb(i => { const n = (i + 1) % images.length; setCur(n); return n; }); }} aria-label="下一张">›</button>
        </div>
      )}
    </React.Fragment>
  );
}

            </div>
          </Reveal>
          <Reveal delay={180}>
            <div className="contact-card card contact-qr">
              <img className="contact-qr-img" src="images/qrcode.png" alt="微信二维码" />
              <span className="contact-label">扫码添加微信</span>
            </div>
          </Reveal>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="footer">
      <div className="container">
        <p className="footer-thanks">谢谢观看 · 期待合作</p>
        <p className="footer-copy">© 2026 {PROFILE.name} · Personal Portfolio</p>
      </div>
    </footer>
  );
}

function App() {
  const progressRef = useRef(null);
  // P2：滚动进度线 + 视差漂浮（hero-image ×0.04 / adv-avatar ×0.03，rAF 节流，移动端与 reduced-motion 自动关闭）
  useEffect(() => {
    const reduced = window.matchMedia("(prefers-reduced-motion:reduce)").matches;
    const hoverNone = window.matchMedia("(hover:none)").matches;
    const parallaxOn = !reduced && !hoverNone;
    const heroImg = document.querySelector(".hero-image");
    const advImg = document.querySelector(".adv-avatar");
    const advSec = document.getElementById("advantage");
    const advMid = advSec ? advSec.offsetTop + advSec.offsetHeight / 2 - window.innerHeight / 2 : 0;
    let ticking = false;
    const clamp = (v, m) => Math.max(-m, Math.min(m, v));
    const update = () => {
      ticking = false;
      const y = window.scrollY;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      if (progressRef.current) {
        progressRef.current.style.width = (max > 0 ? Math.min(100, (y / max) * 100) : 0) + "%";
      }
      if (parallaxOn) {
        if (heroImg) heroImg.style.transform = "translateY(" + clamp(y * 0.04, 40) + "px)";
        if (advImg) advImg.style.transform = "translateY(" + clamp((y - advMid) * 0.03, 24) + "px)";
      }
    };
    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);
  return (
    <React.Fragment>
      <div ref={progressRef} className="scroll-progress" aria-hidden="true" />
      <Nav />
      <main>
        <Hero />
        <Stats />
        <Advantages />
        <Experience />
        <Works />
        <Contact />
      </main>
      <Footer />
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
